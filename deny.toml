# cargo-deny: run by .github/workflows/security.yml (`cargo deny check`).

[graph]
# tuxctl is Linux-only; leave out dependencies of other platforms.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
# RustSec: vulnerabilities and unsound crates fail, as do yanked versions.
yanked = "deny"
ignore = [
    # `paste` is unmaintained (no vulnerability); it comes only through
    # ratatui 0.29's macros. Drop this once ratatui is upgraded.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, not vulnerable; via ratatui 0.29" },
]

[licenses]
# Compatible with tuxctl's MIT license.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
