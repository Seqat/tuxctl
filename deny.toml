# cargo-deny: run by .github/workflows/security.yml (`cargo deny check`).

[graph]
# tuxctl is Linux-only; leave out dependencies of other platforms.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
# RustSec: vulnerabilities and unsound crates fail, as do yanked versions.
yanked = "deny"

[licenses]
# Compatible with tuxctl's MIT license.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
