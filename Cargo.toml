[package]
name = "tuxctl"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
authors = ["Seqat"]
license = "MIT"
repository = "https://github.com/Seqat/tuxctl"
description = "A lightweight, keyboard-first Linux TUI for system monitoring and management."
readme = "README.md"


[features]
# Development only: count renders and write the total to $TUXCTL_REDRAW_LOG
# (used by scripts/measure.py). Off by default and compiled out when disabled.
redraw-counter = []

[dependencies]
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde_json = "1"
