name: Performance

# Manual long run on a hosted runner. Absolute numbers are machine-specific;
# the local measurements in docs/performance.md are the reference.
on:
  workflow_dispatch:
    inputs:
      secs:
        description: Seconds per measure.py scenario
        default: "20"
      minutes:
        description: Minutes of the RSS run
        default: "15"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SECS: ${{ inputs.secs }}
  MINUTES: ${{ inputs.minutes }}

jobs:
  measure:
    name: measure.py and rss.py
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked --features redraw-counter --target-dir target/counter
      - name: Measure
        run: >
          scripts/measure.py target/counter/release/tuxctl
          --label "${GITHUB_SHA::7}" --secs "$SECS" --json measure.json --check
      - name: Measure at the shortest interval
        run: >
          scripts/measure.py target/counter/release/tuxctl
          --label "${GITHUB_SHA::7}-250ms" --secs "$SECS" --json measure-250ms.json --check
          -- --interval 250ms
      - name: RSS over time
        # Reported, not enforced: hosted runners are not the reference machine.
        continue-on-error: true
        run: >
          scripts/rss.py target/counter/release/tuxctl "$MINUTES"
          --json rss.json --max-growth 512 --after 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-${{ github.sha }}
          path: |
            measure.json
            measure-250ms.json
            rss.json
          if-no-files-found: ignore
