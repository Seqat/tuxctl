name: Release

# Publishing a GitHub release attaches static Linux binaries and checksums to
# it and publishes the crate on crates.io. Other triggers are dry runs that
# upload the same files as workflow artifacts only and run `cargo publish
# --dry-run`: a manual run, or a push to dev that changes this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # A dry run reports every target; publishing still needs all of them.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release/tuxctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Pinned so release builds are reproducible; bump deliberately.
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: Read the package version
        run: echo "VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_ENV"
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - run: cargo test --locked --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary
        run: |
          file "$BIN"
          if ! file "$BIN" | grep -Eq 'static(ally|-pie) linked'; then
            echo "::error::$BIN is not statically linked"
            exit 1
          fi
          test "$("$BIN" --version)" = "tuxctl $VERSION"
      - name: Smoke test
        run: scripts/smoke.py "$BIN"
      - name: Package
        run: |
          name="tuxctl-$TARGET"
          mkdir -p "dist/$name"
          cp "$BIN" README.md LICENSE CHANGELOG.md "dist/$name/"
          # Stable ordering, ownership and timestamps for repeatable archives.
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n > "dist/$name.tar.gz"
          {
            echo "### $TARGET"
            echo '```'
            rustc -V
            file "$BIN"
            echo "binary: $(stat -c %s "$BIN") bytes, archive: $(stat -c %s "dist/$name.tar.gz") bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuxctl-${{ matrix.target }}
          path: dist/tuxctl-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: checksums and upload
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement that these archives were built
      # by this workflow from this commit (`gh attestation verify`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum tuxctl-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tuxctl-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuxctl-release
          path: dist/
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "$TAG" dist/tuxctl-*.tar.gz dist/SHA256SUMS
          --clobber --repo "$GITHUB_REPOSITORY"

  crates:
    name: crates.io
    # Only once every binary built, so a broken release never reaches crates.io.
    needs: build
    runs-on: ubuntu-latest
    # crates.io Trusted Publishing: the job trades its GitHub OIDC token for a
    # short-lived publish token; no crates.io token is stored in the repository.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - name: Read the package version
        run: echo "VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_ENV"
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - name: Dry run
        if: github.event_name != 'release'
        run: cargo publish --dry-run --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: github.event_name == 'release'
        id: auth
      - name: Publish
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
