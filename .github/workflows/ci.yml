name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled rustup; no third-party action to pin.
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Package contents
        run: cargo package --locked --list

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets

  pty:
    name: pty smoke and redraw guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked
      - name: Smoke test
        run: scripts/smoke.py target/release/tuxctl
      - run: cargo build --release --locked --features redraw-counter --target-dir target/counter
      - name: Measure (short)
        # Fails only on structural guards (redraw caps, liveness, catastrophe
        # limits); CPU and RSS are reported in the summary and artifact.
        run: >
          scripts/measure.py target/counter/release/tuxctl
          --label "${GITHUB_SHA::7}" --secs 8 --json measure.json --check
      - name: Measure at the shortest interval (short)
        run: >
          scripts/measure.py target/counter/release/tuxctl
          --label "${GITHUB_SHA::7}-250ms" --secs 8 --json measure-250ms.json --check
          -- --interval 250ms
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: measure-${{ github.sha }}
          path: |
            measure.json
            measure-250ms.json
          if-no-files-found: ignore
          retention-days: 30
