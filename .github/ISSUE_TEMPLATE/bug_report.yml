name: Bug report
description: Something in tuxctl does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem belongs in a
        [private report](https://github.com/Seqat/tuxctl/security/advisories/new),
        not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `tuxctl` in a 120×40 terminal
        2. Open the Processes screen
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tuxctl --version
      placeholder: tuxctl 0.3.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options:
        - Release binary (static, musl)
        - cargo install tuxctl (crates.io)
        - Built from the repository
        - Distribution package
        - Other
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: tuxctl --check
      description: The sensors tuxctl finds on your machine. Remove anything you consider private.
      render: text
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
      placeholder: Arch Linux, 6.10.3
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator and size
      placeholder: Konsole 24.08, 160×45
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, logs, or what makes your setup unusual. Check them for private data first.
